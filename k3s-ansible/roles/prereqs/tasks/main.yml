---
# ── Package prerequisites ──────────────────────────────────────────────────────
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install required packages
  ansible.builtin.package:
    name:
      - curl
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - nfs-common       # Required for PVCs backed by NFS
      - open-iscsi       # Required for Longhorn / iSCSI storage
      - iptables
    state: present

# ── Disable swap (k3s / kubelet requirement) ───────────────────────────────────
- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Remove swap entry from /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'

# ── Kernel modules ─────────────────────────────────────────────────────────────
- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - br_netfilter
    - overlay
    - ip_conntrack

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      br_netfilter
      overlay
      ip_conntrack
    mode: "0644"

# ── sysctl settings ────────────────────────────────────────────────────────────
- name: Apply sysctl settings required by k3s
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { key: net.bridge.bridge-nf-call-iptables,  value: "1" }
    - { key: net.bridge.bridge-nf-call-ip6tables, value: "1" }
    - { key: net.ipv4.ip_forward,                 value: "1" }
    - { key: net.ipv6.conf.all.forwarding,        value: "1" }
    - { key: vm.swappiness,                        value: "0" }

# ── Firewall rules (ufw) ───────────────────────────────────────────────────────
- name: Allow k3s API server port
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
  when: ansible_os_family == "Debian"

- name: Allow etcd peer and client ports (masters only)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "2379"   # etcd client
    - "2380"   # etcd peer
  when:
    - ansible_os_family == "Debian"
    - inventory_hostname in groups['masters']

- name: Allow Flannel VXLAN overlay
  community.general.ufw:
    rule: allow
    port: "8472"
    proto: udp
  when: ansible_os_family == "Debian"

- name: Allow kubelet metrics / health
  community.general.ufw:
    rule: allow
    port: "10250"
    proto: tcp
  when: ansible_os_family == "Debian"

- name: Allow NodePort range
  community.general.ufw:
    rule: allow
    port: "30000:32767"
    proto: tcp
  when: ansible_os_family == "Debian"

# ── Hostname / hosts file ──────────────────────────────────────────────────────
- name: Set hostname to inventory alias
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Ensure /etc/hosts contains cluster members
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[item].ansible_host }} {{ item }}"
    state: present
  loop: "{{ groups['all'] }}"
