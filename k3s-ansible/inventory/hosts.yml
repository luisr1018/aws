---
all:
  children:
    masters:
      hosts:
        # Initial master — bootstraps the cluster with embedded etcd
        k3s-master-1:
          ansible_host: 10.0.20.15
          k3s_role: initial_master
        # Additional masters join the HA cluster
        k3s-master-2:
          ansible_host: 10.0.20.17
          k3s_role: additional_master
        k3s-master-3:
          ansible_host: 10.0.20.19
          k3s_role: additional_master
    # NOTE: 10.0.20.17 and 10.0.20.19 were listed as both masters and workers.
    # In k3s, server nodes schedule workloads by default, so they effectively
    # act as workers too. Add dedicated worker IPs here if you have separate nodes.
    workers:
      hosts: {}
  vars:
    ansible_user: ubuntu           # Change to your SSH user
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    ansible_python_interpreter: /usr/bin/python3
