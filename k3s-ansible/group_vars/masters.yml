---
# Flannel backend — options: vxlan (default), wireguard-native, none (BYO CNI)
k3s_flannel_backend: "vxlan"

# Disable built-in components if you prefer external alternatives
k3s_disable_components:
  - servicelb     # Disable Klipper LB if you plan to use MetalLB
  # - traefik     # Uncomment to disable the built-in Traefik ingress

# Write kubeconfig to this path after the cluster is up
k3s_kubeconfig_output: "{{ k3s_config_dir }}/k3s.yaml"
