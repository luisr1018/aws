---
# ── k3s version ───────────────────────────────────────────────────────────────
k3s_version: "v1.29.4+k3s1"   # Pin to a tested release; update deliberately

# ── Cluster networking ────────────────────────────────────────────────────────
k3s_cluster_cidr: "10.42.0.0/16"      # Pod CIDR
k3s_service_cidr: "10.43.0.0/16"      # Service CIDR
k3s_cluster_dns: "10.43.0.10"         # CoreDNS cluster IP

# ── Initial master / API server endpoint ─────────────────────────────────────
# This is the IP of the first master node used to bootstrap etcd.
k3s_initial_master_ip: "10.0.20.15"

# The URL additional masters and workers use to join the cluster.
# Point this at a load balancer VIP if you add one later.
k3s_api_server_url: "https://{{ k3s_initial_master_ip }}:6443"

# ── Token ─────────────────────────────────────────────────────────────────────
# Pre-shared secret used by all nodes to join the cluster.
# Override via: ansible-playbook site.yml -e "k3s_token=<secret>"
# Or store in an Ansible vault file.
k3s_token: "changeme-use-a-long-random-secret"

# ── Installation flags ────────────────────────────────────────────────────────
# Extra args appended to the k3s server / agent install command.
k3s_server_extra_args: ""
k3s_agent_extra_args: ""

# ── System settings ───────────────────────────────────────────────────────────
k3s_install_dir: /usr/local/bin
k3s_config_dir: /etc/rancher/k3s
k3s_data_dir: /var/lib/rancher/k3s
